services:
  app:
    build: .
    image: especificador-img
    container_name: especificador-app
    restart: unless-stopped
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8087:8000"
    volumes:
      - .:/app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/database/database.sqlite
      - APP_URL=https://lab.motazorrilla.com/especificador
      - ASSET_URL=https://lab.motazorrilla.com/especificador

